services:
  web:
    image: node:22-slim
    container_name: peludos_web_dev
    working_dir: /app
    environment:
      # Dónde escucha el back. Se usa en proxy.conf.js
      API_TARGET: ${API_TARGET:-http://host.docker.internal:8001}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${WEB_PORT:-4200}:4200"
    volumes:
      - .:/app
      # Fuera de la carpeta del proyecto para que OneDrive no sincronice miles de archivos
      - peludos_web_node_modules:/app/node_modules
      - peludos_web_angular_cache:/app/.angular
    command: sh -c "npm install --no-audit --no-fund && npm start"

volumes:
  peludos_web_node_modules:
  peludos_web_angular_cache:
